$('#imp').onchange=e=>{if(e.target.files[0])importBackup(e.target.files[0]);e.target.value=''};
document.addEventListener('input',e=>{if(e.target.id=='pkQ')pkRender();else if(e.target.id=='q'){S.q=e.target.value.trim();render()}else if(e.target.dataset&&e.target.dataset.ord!=null){ord.items[+e.target.dataset.ord][e.target.dataset.f]=parseInt(e.target.value)||0}else if(e.target.id=='exq'){S.eq=e.target.value;$('#exGrid').innerHTML=exBody()}else if(e.target.id=='tN'||e.target.id=='tK'){td.name=$('#tN').value;td.color=$('#tK').value;$('#tPv').innerHTML=chip(td)}});
document.addEventListener('change',async e=>{const t=e.target;
 if(t.id=='pvOn'){PV.on=t.checked;try{localStorage.setItem('prev',PV.on?'1':'0')}catch{}if(!PV.on)stopPreview(true);else syncPreview();return}
 if(t.id=='nmOn'){NORM.on=t.checked;try{localStorage.setItem('norm',NORM.on?'1':'0')}catch{}if(NORM.on){ensureGraph();analyseAll()}applyGain(true);return toast(NORM.on?'Volume levelling on':'Volume levelling off (restart the app to remove it completely)')}
 if(t.id=='nmT'){NORM.target=parseFloat(t.value);try{localStorage.setItem('normT',String(NORM.target))}catch{}return applyGain(true)}
 if(t.id=='pgSel'){pgrp=t.value;try{localStorage.setItem('pgrp',pgrp)}catch{}return render()}
 if(t.id=='syS'){S.sy=t.value===''?'':+t.value;S.sm='';return render()}
 if(t.id=='smS'){S.sm=t.value===''?'':+t.value;return render()}
 if(t.id=='scSel'){S.sc=t.value||null;S.sf=null;S.fav=false;S.lb=false;return render()}
 if(t.id=='nK')return nKChange(t.value);
 if(t.id=='tpI')return tpAdd(t.value);
 if(t.id=='sortSel'){sortK=t.value;try{localStorage.setItem('sort',sortK)}catch{}return render()}
 if(t.id=='nF')return nFChange(t.value);
 if(t.id=='songSort'){setSort(S.id,t.value);return render()}
 if(t.id=='dKind'){$('#dBox').className=t.value=='album'?'isAlbum':'isGame';return}
 if(t.id=='kaF'&&t.files[0]){const f=t.files[0];ls.pending=busy('[data-act=lSave]',async()=>{const k=$('#kaP');if(k)k.innerHTML='<small style="padding:6px">Preparing...</small>';const b=await toBlob(f,1800,.82);if(b){ls.artBlob=b;ls.artDel=false}else toast(BADIMG);
   const k2=$('#kaP');if(k2){const u=ls.artBlob?URL.createObjectURL(ls.artBlob):(ls.artDel?'':artUrl(ls.id));k2.innerHTML=u?`<img src="${u}" alt="">`:''}});await ls.pending;return}
 if(t.id=='lC'&&t.files[0]){const f=t.files[0];ls.pending=busy('[data-act=lSave]',async()=>{const d=await toData(f,500,false);if(d)ls.img=d;else toast(BADIMG);const p=$('#lP');if(p)p.innerHTML=art(ls.img,'?')});await ls.pending;return}
 if(t.id=='tI'&&t.files[0]){const f=t.files[0];td.pending=busy('[data-act=tagSave]',async()=>{const d=await toData(f,64,true);if(d)td.icon=d;else toast(BADIMG);const p=$('#tPv');if(p)p.innerHTML=chip(td)});await td.pending;return}
if(t.id=='eC'){const f=t.files[0];if(f)$('#eP').innerHTML=`<img src="${URL.createObjectURL(f)}" alt="">`}else if(t.id=='pS')pkRender();else if(t.dataset.pk){t.checked?pk.sel.add(t.dataset.pk):pk.sel.delete(t.dataset.pk);$('#pG').textContent='Add '+pk.sel.size}});
(async()=>{
 await open();(await idb('songs','readonly',s=>s.getAll())).forEach(s=>songs.set(s.id,s));for(const s of songs.values())SNAP.set(s.id,TRK.map(k=>jv(s[k])));lists=await idb('lists','readonly',s=>s.getAll());
 (await idb('blobs','readonly',s=>s.getAllKeys())).forEach(k=>haveBlob.add(k));
 for(const m of await idb('meta','readonly',s=>s.getAll())){if(m.id=='cfg'){const{id,...c}=m;cfg=c}if(m.id=='tomb')tomb=m.map||{};if(m.id=='logseq')logSeq=m.n||0;if(m.id=='stats')statsMeta=m;if(m.id=='syncstate'){srvSeq=m.seq||0;lastPush=m.push||0}}
 LOG=await idb('log','readonly',s=>s.getAll());TRASH=await idb('trash','readonly',s=>s.getAll());{const cut=Date.now()-30*864e5;for(const e of TRASH.filter(x=>x.at<cut))await dropEntry(e)}for(const a of await idb('art','readonly',s=>s.getAll()))ART.set(a.id,{blob:a.blob,cmod:a.cmod});
 for(const c of await idb('covers','readonly',s=>s.getAll())){COV.set(c.id,c.blob);WM.set(c.blob,c.id)}for(const s of songs.values())if(s.cvh&&!s.cover)s.cover=COV.get(s.cvh)||null;if(!statsMeta){statsMeta={id:'stats',start:Date.now(),legacy:all().reduce((a,s)=>a+(s.plays||0),0)};put('meta',statsMeta)}
 for(const s of songs.values())if(s.cover&&!s.cmod)s.cmod=s.added;
 for(const s of songs.values())if(s.cover&&!(s.cover.type||'').startsWith('image/'))s.cover=imgBlob(await s.cover.arrayBuffer());
 {const old=[...songs.values()].filter(s=>s.cover&&!s.cvh);if(old.length){toast('Optimising cover art…');for(const s of old){await normCover(s);await put('songs',s)}}}   /* one-off: move per-song covers into the shared store */
 await gcCovers();
 await migrateTags();await cleanTags();await restorePlay();render();paint();backfill();sync();featStart();setTimeout(()=>analyseAll(),6000);addEventListener('online',()=>sync());
 if(navigator.storage?.persist)navigator.storage.persist();
 if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js')})();
</script></body></html>
