</style></head><body>

<script>
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let db,songs=new Map(),lists=[],S={t:'home'},hist=[];
/* ---------- storage (IndexedDB) ---------- */
const open=()=>new Promise((res,rej)=>{const r=indexedDB.open('tunebox',2);r.onupgradeneeded=()=>['songs','blobs','lists','meta'].forEach(n=>{if(!r.result.objectStoreNames.contains(n))r.result.createObjectStore(n,{keyPath:'id'})});r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)});
const idb=(st,mode,fn)=>new Promise((res,rej)=>{const tx=db.transaction(st,mode),r=fn(tx.objectStore(st));tx.oncomplete=()=>res(r&&r.result);tx.onerror=()=>rej(tx.error)});
const put=(st,o)=>idb(st,'readwrite',s=>s.put(o)),del=(st,id)=>idb(st,'readwrite',s=>s.delete(id));
/* ---------- helpers ---------- */
const h53=s=>{let a=3735928559,b=1103547991;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677)}a=Math.imul(a^a>>>16,2246822507)^Math.imul(b^b>>>13,3266489909);b=Math.imul(b^b>>>16,2246822507)^Math.imul(a^a>>>13,3266489909);return(4294967296*(2097151&b)+(a>>>0)).toString(36)};
const rnd=()=>Math.random().toString(36).slice(2,8),all=()=>[...songs.values()];
const ttl=s=>s.title||s.fn.replace(/\.[^.]+$/,''),needs=s=>!s.title||!s.artist||!s.album||!s.cover;
const hue=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h};
const art=(u,n)=>u?`<img loading="lazy" src="${u}" alt="">`:`<div class="ph" style="background:hsl(${hue(n||'?')},42%,40%)">${esc((n||'?')[0].toUpperCase())}</div>`;
const urls=new Map(),cu=s=>{if(!s.cover)return'';if(!urls.has(s.id))urls.set(s.id,URL.createObjectURL(s.cover));return urls.get(s.id)};
const lcover=l=>{if(l.img)return l.img;const s=l.songs.map(i=>songs.get(i)).find(s=>s&&s.cover);return s?cu(s):''};
const fm=x=>isFinite(x)?(x/60|0)+':'+String(x%60|0).padStart(2,'0'):'0:00';
let tt;const toast=m=>{const e=$('#toast');e.textContent=m;e.style.opacity=1;clearTimeout(tt);tt=setTimeout(()=>e.style.opacity=0,2000)};
const byTitle=(a,b)=>ttl(songs.get(a)).localeCompare(ttl(songs.get(b)));
/* ---------- tag reading ---------- */
const dec=(b,e)=>{try{let t;if(e==1)t=new TextDecoder(b[0]==254&&b[1]==255?'utf-16be':'utf-16le').decode(b);else t=new TextDecoder(e==2?'utf-16be':e==3?'utf-8':'iso-8859-1').decode(b);return t.replace(/\uFEFF|\0/g,'').trim()}catch{return''}};
async function id3(f){const o={},hd=new Uint8Array(await f.slice(0,10).arrayBuffer());
 if(String.fromCharCode(...hd.slice(0,3))!='ID3'||hd[3]<3)return o;
 const v=hd[3],sz=((hd[6]&127)<<21)|((hd[7]&127)<<14)|((hd[8]&127)<<7)|(hd[9]&127);
 const b=new Uint8Array(await f.slice(10,10+sz).arrayBuffer()),dv=new DataView(b.buffer);let p=0;
 while(p+10<=b.length){const id=String.fromCharCode(...b.slice(p,p+4));if(!/^[A-Z0-9]{4}$/.test(id))break;
  const fs=v==4?((b[p+4]&127)<<21)|((b[p+5]&127)<<14)|((b[p+6]&127)<<7)|(b[p+7]&127):dv.getUint32(p+4);
  const d=b.slice(p+10,p+10+fs);p+=10+fs;
  if(id=='TIT2')o.title=dec(d.slice(1),d[0]);else if(id=='TPE1')o.artist=dec(d.slice(1),d[0]);else if(id=='TALB')o.album=dec(d.slice(1),d[0]);
  else if(id=='TRCK')o.trk=parseInt(dec(d.slice(1),d[0]))||0;
  else if(id=='APIC'&&!o.cover){const e=d[0];let i=1;while(d[i])i++;const mime=String.fromCharCode(...d.slice(1,i));i+=2;
   if(e==1||e==2){while(i<d.length&&!(d[i]==0&&d[i+1]==0))i+=2;i+=2}else{while(i<d.length&&d[i])i++;i++}
   o.cover=new Blob([d.slice(i)],{type:mime.includes('/')?mime:'image/'+mime.toLowerCase()})}}

/* MP4/M4A tags: moov > udta > meta > ilst, with iTunes-style atoms */
async function m4a(f){const o={},rd=async(a,n)=>new Uint8Array(await f.slice(a,a+n).arrayBuffer());let p=0;
 while(p+8<=f.size){const h=await rd(p,16),dv=new DataView(h.buffer);let sz=dv.getUint32(0),hl=8;const ty=String.fromCharCode(h[4],h[5],h[6],h[7]);
  if(sz==1){sz=Number(dv.getBigUint64(8));hl=16}else if(sz==0)sz=f.size-p;if(sz<hl)break;
  if(ty=='moov'){const b=await rd(p+hl,Math.min(sz-hl,16777216));const bx=(s,e,cb)=>{const d=new DataView(b.buffer);while(s+8<=e){let z=d.getUint32(s);const t4=String.fromCharCode(b[s+4],b[s+5],b[s+6],b[s+7]);if(z<8)break;if(s+z>e)z=e-s;cb(t4,s+8,s+z);s+=z}};
   const item=(k,s,e)=>bx(s,e,(t4,s4,e4)=>{if(t4!='data')return;const d=new DataView(b.buffer),ty2=d.getUint32(s4)&0xffffff,v=b.slice(s4+8,e4),txt=()=>new TextDecoder().decode(v).trim();
    if(k=='\xa9nam')o.title=txt();else if(k=='\xa9ART')o.artist=txt();else if(k=='aART'&&!o.artist)o.aart=txt();else if(k=='\xa9alb')o.album=txt();else if(k=='trkn')o.trk=(v[2]<<8|v[3])||0;
    else if(k=='covr'&&!o.cover)o.cover=new Blob([v],{type:ty2==14?'image/png':'image/jpeg'})});
   const walk=(s,e)=>bx(s,e,(t4,s4,e4)=>{if(t4=='udta')walk(s4,e4);else if(t4=='meta')walk(s4+4,e4);else if(t4=='ilst')bx(s4,e4,(k,a,z)=>item(k,a,z))});
   walk(0,b.length);if(!o.artist&&o.aart)o.artist=o.aart;delete o.aart;break}
  p+=sz}
 return o}
async function ogg(f){const o={},b=new Uint8Array(await f.slice(0,262144).arrayBuffer());
 const find=s=>{const n=[...s].map(c=>c.charCodeAt(0));outer:for(let i=0;i<b.length-n.length;i++){for(let j=0;j<n.length;j++)if(b[i+j]!=n[j])continue outer;return i+n.length}return -1};
 let p=find('\x03vorbis');if(p<0)p=find('OpusTags');if(p<0)return o;
 const dv=new DataView(b.buffer);p+=4+dv.getUint32(p,true);const n=dv.getUint32(p,true);p+=4;
 for(let i=0;i<n&&p+4<b.length;i++){const l=dv.getUint32(p,true);p+=4;const t=new TextDecoder().decode(b.slice(p,p+l));p+=l;const k=t.indexOf('=');
  if(k>0){const key=t.slice(0,k).toLowerCase(),val=t.slice(k+1).trim();if(key=='title')o.title=val;if(key=='artist')o.artist=val;if(key=='album')o.album=val;if(key=='tracknumber')o.trk=parseInt(val)||0}}
 return o}
async function addFiles(files){let n=0;const newIds=[];
 for(const f of files){if(!/\.(mp3|m4a|wav|ogg|oga|opus)$/i.test(f.name))continue;const id=h53(f.name+f.size);if(songs.has(id)){if(!haveBlob.has(id)){await put('blobs',{id,file:f});haveBlob.add(id);n++}continue}
  let t={};try{t=/\.mp3$/i.test(f.name)?await id3(f):/\.m4a$/i.test(f.name)?await m4a(f):/\.(ogg|oga|opus)$/i.test(f.name)?await ogg(f):{}}catch{}
  const dur=await getDur(f);const s={id,fn:f.name,dur,title:t.title||'',artist:t.artist||'',album:t.album||'',trk:t.trk||0,cover:t.cover||null,cmod:t.cover?Date.now():0,fav:0,rating:0,plays:0,added:Date.now(),mod:Date.now()};
  songs.set(id,s);await put('songs',s);await put('blobs',{id,file:f});haveBlob.add(id);newIds.push(id);n++;if(n%5==0)toast('Adding… '+n)}
 toast(n?`Added ${n} song${n>1?'s':''}`:'Nothing new to add');render();offerCollections(newIds)}
const getDur=f=>new Promise(res=>{const a=new Audio(),u=URL.createObjectURL(f);const done=d=>{a.src='';URL.revokeObjectURL(u);res(isFinite(d)&&d>0?d:0)};a.preload='metadata';a.onloadedmetadata=()=>done(a.duration);a.onerror=()=>done(0);setTimeout(()=>done(0),3000);a.src=u});
async function backfill(){let fails=0,n=0;for(const s of all()){if(s.dur||fails>=3)continue;const b=await idb('blobs','readonly',st=>st.get(s.id));if(!b)continue;s.dur=await getDur(b.file);if(s.dur){fails=0;await put('songs',s);if(++n%25==0)render()}else fails++}if(n)render()}
async function fitCover(f){try{const b=await createImageBitmap(f),k=Math.min(1,800/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=Math.round(b.width*k);c.height=Math.round(b.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(b,0,0,c.width,c.height);return await new Promise(r=>c.toBlob(o=>r(o||f),'image/jpeg',.9))}catch{return f}}
/* ---------- collections & playlists ---------- */
function colls(){return lists.filter(l=>l.type=='collection')}
const pls=()=>lists.filter(l=>l.type=='playlist'),getList=id=>colls().find(c=>c.id==id)||lists.find(l=>l.id==id);
function sub(p,cs){const set=new Set(p.songs);if(!set.size)return'';let best=null;
 for(const c of cs){if(c.id=='all'||c.id=='fav')continue;const cset=new Set(c.songs);if([...set].every(x=>cset.has(x))&&(!best||c.songs.length<best.songs.length))best=c}

 serCols:t=>{const s=lists.find(x=>x.id==t.dataset.id);sheet(`<h3>Collections in ${esc(s.name)}</h3><p class="mut">A collection can only be in one series, so ticking one moves it here.</p>${colls().sort(sorters.az).map(c=>`<label class="pk"><input type="checkbox" data-sc="${esc(c.id)}" ${c.ser==s.id?'checked':''}>${esc(c.name)}${c.ser&&c.ser!=s.id?`<small>in ${esc((lists.find(x=>x.id==c.ser)||{}).name||'another series')}</small>`:''}</label>`).join('')||'<p class="mut">No collections yet.</p>'}<button class="p" data-act="serSave" data-id="${esc(s.id)}">Save</button>`)},

  for(const id of ids){const s=songs.get(id);if(!s)continue;if(a)s.artist=a;if(b)s.album=b;if(cv){s.cover=cv;s.cmod=Date.now();urls.delete(id)}
   s.tags=[...new Set([...(s.tags||[]),...(tp.col?tp.sel:[])])].filter(x=>!bRm.has(x));s.mod=Date.now();await put('songs',s)}
  closeSheet();endSel();toast(`Updated ${ids.length} songs`);render()},
 bAdd:()=>{if(!sel.size)return toast('Select songs first');menu('Add to…',lists.filter(l=>l.type=='playlist'||l.type=='collection').map(l=>[(l.type=='playlist'?'Playlist: ':'Collection: ')+l.name,()=>{addTo(l,[...sel]);endSel()}]))},
 bMore:()=>{if(!sel.size)return toast('Select songs first');const src=lists.find(x=>x.id==selCtx&&(x.type=='playlist'||x.type=='collection'));
  const it=[['Favourite all',async()=>{for(const id of sel){const s=songs.get(id);s.fav=1;s.mod=Date.now();await put('songs',s)}endSel();render()}]];
  if(src)it.push(['Remove from this list',async()=>{src.songs=src.songs.filter(x=>!sel.has(x));src.mod=Date.now();await put('lists',src);if(src.type=='collection')await cleanTags();endSel();render()}]);
  it.push(['Delete from library',async()=>{if(!confirm(`Delete ${sel.size} songs from your library?`))return;for(const id of [...sel])await purge(id);saveTomb();endSel();render()}]);menu(sel.size+' songs',it)},
 lNoImg:()=>{const l=lists.find(x=>x.id==ls.id);ls.img='';$('#lP').innerHTML=l.type=='series'?serArt({...l,img:''}):art(lcover({songs:l.songs}),l.name)},
 lSave:async()=>{const l=lists.find(x=>x.id==ls.id),n=$('#lN').value.trim();if(!n)return toast('Enter a name');Object.assign(l,{name:n,desc:$('#lD').value.trim(),tags:[...tp.sel],img:ls.img,mod:Date.now()});if($('#lCol'))l.col=$('#lCol').value||undefined;if($('#lSer'))l.ser=$('#lSer').value||undefined;await put('lists',l);closeSheet();render()},
 lDel:async()=>{const l=lists.find(x=>x.id==ls.id);if(!l||!confirm(`Delete "${l.name}"? Songs stay in your library.`))return;lists=lists.filter(x=>x!=l);tomb[l.id]=Date.now();saveTomb();if(l.type=='series'){for(const c of lists.filter(x=>x.type=='collection'&&x.ser==l.id)){c.ser=undefined;c.mod=Date.now();await put('lists',c)}}
  if(l.type=='collection'){const ts=lists.filter(x=>x.type=='stag'&&x.col==l.id);for(const x of ts){tomb[x.id]=Date.now();await del('lists',x.id)}lists=lists.filter(x=>!ts.includes(x));saveTomb();await cleanTags()}await del('lists',l.id);closeSheet();S=hist.pop()||{t:'home'};render()},
 addsongs:t=>pickSongs(t.dataset.id),
 addfiles:()=>$('#file').click(),
 syncSet:()=>sheet(`<h3>Sync</h3><label>Server address (you can list several, separated by commas)</label><input id="sU" placeholder="https://192.168.1.20:8765" value="${esc(cfg.url||'')}"><label>Access token</label><input id="sT" value="${esc(cfg.token||'')}"><label class="pk"><input type="checkbox" id="sD" ${cfg.dl===false?'':'checked'}>Download songs to this device</label><button class="p" data-act="sSave">Save and sync</button>${cfg.url?' <button data-act="sOff">Turn off sync</button>':''}`),
 sSave:async()=>{cfg={url:$('#sU').value.trim(),token:$('#sT').value.trim(),dl:$('#sD').checked};await saveCfg();closeSheet();sync(1)},
 sOff:async()=>{cfg={};await del('meta','cfg');closeSheet();render();toast('Sync turned off')},
jump:t=>playAt(+t.dataset.i),rate:t=>rate(+t.dataset.n),
 newList:()=>{const sers=lists.filter(l=>l.type=='series'),cl=lists.filter(l=>l.type=='collection'),opt=x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`;
  sheet(`<h3>New</h3><label>Name</label><input id="nN" placeholder="e.g. The Legend of Zelda: Ocarina of Time"><label>Type</label><select id="nK"><option value="collection">Collection</option><option value="playlist">Playlist</option><option value="series">Series</option></select><div id="nSw"><label>Series (optional)</label><select id="nSe"><option value="">(none)</option>${sers.map(opt).join('')}</select></div><div id="nCw" hidden><label>Inside</label><select id="nC">${cl.length?`<optgroup label="Collections">${cl.map(opt).join('')}</optgroup>`:''}${sers.length?`<optgroup label="Series">${sers.map(opt).join('')}</optgroup>`:''}</select></div><div id="nFw"><label>Start with</label><select id="nF"><option value="">Nothing (empty)</option><option value="album">Songs from an album</option><option value="stag">Songs with a song tag (makes a playlist)</option><option value="every">One collection for every unsorted album</option></select><select id="nS" hidden></select></div><button class="p" data-act="mk">Create</button>`);
  if(pending.length){$('#nK').value='playlist';nKChange('playlist');const c=collOf(pending[0]);if(c)$('#nC').value=c}},
 mk:async()=>{const f=$('#nF').value,src=$('#nS').value;let type=$('#nK').value;const trk=(x,y)=>(x.trk||0)-(y.trk||0)||ttl(x).localeCompare(ttl(y)),serV=(type=='collection'?$('#nSe').value:'')||undefined;
  if(type=='series'){const n=$('#nN').value.trim();if(!n)return toast('Enter a name');const s=await mkList({name:n,type:'series'});closeSheet();hist.push(S);S={t:'list',id:s.id};return render()}
  if(f=='every'){const cm=collMap(),m=new Map();for(const s of songs.values())if(s.album&&!cm.has(s.id)){if(!m.has(s.album))m.set(s.album,[]);m.get(s.album).push(s)}
   for(const[a,ss]of m){const c=lists.find(l=>l.type=='collection'&&l.name==a)||await mkList({name:a,type:'collection',ser:serV});await toColl(c,ss.sort(trk).map(s=>s.id))}
   closeSheet();render();return toast(m.size?`Sorted ${m.size} album${m.size>1?'s':''} into collections`:'No unsorted albums found')}
  let name=$('#nN').value.trim(),ids=[],col,ser;
  if(f=='stag'){type='playlist';const st=tag(src);if(st){ids=all().filter(s=>(s.tags||[]).includes(src)).map(s=>s.id).sort(byTitle);name=name||st.name;col=st.col}}
  if(f=='album'){ids=all().filter(s=>s.album==src).sort(trk).map(s=>s.id);name=name||src}
  if(!name)return toast('Enter a name');
  ids=ids.concat(pending);
  if(type=='playlist'){const h=lists.find(x=>x.id==$('#nC').value);if(!col){if(h&&h.type=='series')ser=h.id;else col=h?h.id:collOf(ids[0])}if(!col&&!ser)return toast('Create a collection or series first, then add playlists to it')}
  const l=await mkList({name,type,songs:type=='playlist'?ids:[],col:type=='playlist'?col:undefined,ser:type=='playlist'?ser:serV});
  if(type=='collection'){const mv=await toColl(l,ids);if(mv)toast(`Moved ${mv} songs from other collections`)}
  pending=[];closeSheet();hist.push(S);S={t:'list',id:l.id};render()},
 saveInfo:async t=>{const s=songs.get(t.dataset.id);s.title=$('#eT').value.trim();s.artist=$('#eA').value.trim();s.album=$('#eB').value.trim();s.tags=[...tp.sel];const f=$('#eC').files[0];if(f){s.cover=await fitCover(f);s.cmod=Date.now();urls.delete(s.id)}s.mod=Date.now();await put('songs',s);closeSheet();if(Q[qi]==s.id)paint();render()},

 more:()=>menu('Ocarina of Time',[['Switch to '+(curTheme()=='dark'?'light':'dark')+' mode',()=>setTheme(curTheme()=='dark'?'light':'dark')],...(cfg.url?[['Sync now'+(lastSync?' (last '+new Date(lastSync).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})+')':''),()=>sync(1)]]:[]),['Manage tags',tagMgr],['Sync settings',A.syncSet],['Add a whole folder (desktop browsers)',()=>$('#dir').click()],['Export backup',exportBackup],['Import backup',()=>$('#imp').click()],['Storage used',async()=>{const e=await navigator.storage?.estimate?.();toast(e?`${(e.usage/1e9).toFixed(2)} GB used`:'Not available')}]])};
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(t&&A[t.dataset.act])A[t.dataset.act](t)});
$$('.tab').forEach(b=>b.onclick=()=>{endSel();S={t:b.dataset.t};hist=[];S.q='';$('#q').value='';S.q='';render()});

document.addEventListener('change',async e=>{const t=e.target;
 if(t.id=='scSel'){S.sc=t.value||null;S.sf=null;S.fav=false;return render()}
 if(t.id=='nK')return nKChange(t.value);
 if(t.id=='tpI')return tpAdd(t.value);
 if(t.id=='sortSel'){sortK=t.value;try{localStorage.setItem('sort',sortK)}catch{}return render()}
 if(t.id=='nF')return nFChange(t.value);
 if(t.id=='lC'&&t.files[0]){ls.img=await toData(t.files[0],500,false);$('#lP').innerHTML=art(ls.img,'?');return}
 if(t.id=='tI'&&t.files[0]){td.icon=await toData(t.files[0],64,true);$('#tPv').innerHTML=chip(td);return}
if(t.id=='eC'){const f=t.files[0];if(f)$('#eP').innerHTML=`<img src="${URL.createObjectURL(f)}" alt="">`}else if(t.id=='pS')pkRender();else if(t.dataset.pk){t.checked?pk.sel.add(t.dataset.pk):pk.sel.delete(t.dataset.pk);$('#pG').textContent='Add '+pk.sel.size}});
(async()=>{try{const th=localStorage.getItem('th');if(th)document.documentElement.dataset.theme=th}catch{}
 await open();(await idb('songs','readonly',s=>s.getAll())).forEach(s=>songs.set(s.id,s));lists=await idb('lists','readonly',s=>s.getAll());
 (await idb('blobs','readonly',s=>s.getAllKeys())).forEach(k=>haveBlob.add(k));
 for(const m of await idb('meta','readonly',s=>s.getAll())){if(m.id=='cfg'){const{id,...c}=m;cfg=c}if(m.id=='tomb')tomb=m.map||{}}
 for(const s of songs.values())if(s.cover&&!s.cmod){s.cmod=s.added;put('songs',s)}
 for(const s of songs.values())if(s.cover&&!(s.cover.type||'').startsWith('image/')){s.cover=imgBlob(await s.cover.arrayBuffer());urls.delete(s.id);put('songs',s)}
 await migrateTags();await cleanTags();render();backfill();sync();addEventListener('online',()=>sync());
 if(navigator.storage?.persist)navigator.storage.persist();
 if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js')})();
