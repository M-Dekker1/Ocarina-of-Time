<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ocarina of Time</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ocarina of Time">
<meta name="theme-color" content="#081A12">
<style>/* ===== Design tokens ===== */
:root{
--bg:#081A12;--card:#112B20;--raise:#193B2C;--acc:#B9D1A8;--gold:#D6B36C;--line:#263C30;
--fg:#E7EFE4;--mut:#9BB0A2;--on-acc:#081A12;--sh:rgba(0,0,0,.45);--tint:#112B20;
--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;
--r-sm:8px;--r-md:12px;--r-lg:18px;--r-xl:24px;
--fs-xs:11px;--fs-sm:12px;--fs-md:13px;--fs-base:15px;--fs-lg:17px;--fs-xl:22px;--fs-2xl:28px;--fs-3xl:40px;
--ease:cubic-bezier(.2,.8,.2,1);--t:.16s;
--g:12px;--sbw:240px;--npH:96px;--navH:0px;--rpw:340px;--rpm:0px}
@media(min-width:1180px){body.rpo{--rpm:calc(var(--rpw) + var(--g)*2)}}
@media(max-width:820px){:root{--g:0px;--sbw:0px;--rpm:0px;--npH:68px;--navH:calc(58px + env(safe-area-inset-bottom))}}
@media(prefers-contrast:more){:root{--line:#4A6655;--mut:#B8C9BC}}

/* ===== Base ===== */
html{color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:var(--r-sm);border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:color-mix(in srgb,var(--line) 55%,var(--acc));background-clip:content-box}
body{margin:0;background:var(--bg);color:var(--fg);font:var(--fs-base)/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding-top:env(safe-area-inset-top);-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0}h1{font-size:var(--fs-2xl);letter-spacing:-.02em}h2{font-size:var(--fs-lg);font-weight:650;margin:var(--s6) 0 var(--s3)}h3{font-size:var(--fs-base)}
label{font-size:var(--fs-sm);color:var(--mut)}small,.mut{color:var(--mut)}small{display:block}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.song:focus-visible{outline-offset:-2px}.card:focus-visible{outline:none}.card:focus-visible .art{outline:2px solid var(--acc);outline-offset:3px}
.i{width:1.25em;height:1.25em;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.25em}

/* ===== Buttons: primary (.p / .pill), secondary (default), icon (.ic) ===== */
button{font:inherit;color:var(--fg);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);min-height:36px;padding:var(--s2) var(--s4);border:1px solid var(--line);border-radius:var(--r-md);background:transparent;transition:background-color var(--t),border-color var(--t),color var(--t),transform var(--t),opacity var(--t)}
button:hover{background:var(--raise)}
button:active{transform:scale(.97)}
button:disabled{opacity:.5;cursor:default}
button.p,.pill{background:var(--acc);border-color:var(--acc);color:var(--on-acc);font-weight:600}
button.p:hover,.pill:hover{background:color-mix(in srgb,var(--acc) 86%,#fff);border-color:transparent}
.pill{padding:var(--s3) var(--s5)}
.ic{min-width:36px;min-height:36px;padding:0 var(--s2);border:0;color:var(--mut);font-size:var(--fs-md)}
.ic:hover{background:var(--raise);color:var(--fg)}
.ic .i{width:20px;height:20px}.ic.on{color:var(--acc)}
.mi{display:flex;width:100%;justify-content:flex-start;text-align:left;margin:var(--s1) 0;border-color:transparent}
.ub{margin-left:var(--s3);min-height:28px;padding:0 var(--s3);background:var(--bg);color:var(--fg);border:0;border-radius:var(--r-sm);font-weight:600}

/* ===== Form fields ===== */
:where(input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=file]),select,textarea){font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:var(--r-md);padding:var(--s2) var(--s3);transition:border-color var(--t)}
:where(input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=file]),select,textarea):hover{border-color:color-mix(in srgb,var(--line) 50%,var(--acc))}
input[type=checkbox],input[type=range]{accent-color:var(--acc)}
input[type=file]{font:inherit;color:var(--mut);max-width:100%}
input[type=file]::file-selector-button{font:inherit;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:var(--r-md);padding:var(--s2) var(--s3);margin-right:var(--s3);cursor:pointer}
input[type=file]::file-selector-button:hover{background:var(--raise)}
.pk{display:flex;align-items:center;gap:var(--s2);padding:var(--s1) 0;color:var(--fg);font-size:var(--fs-base)}.pk small{display:inline;margin-left:var(--s2)}

/* ===== Layout shell ===== */
#side{position:fixed;left:var(--g);top:var(--g);bottom:var(--npH);width:var(--sbw);background:var(--card);border-radius:var(--r-xl);display:flex;flex-direction:column;padding:var(--s5) var(--s3) var(--s3);z-index:6;overflow:auto}
.brand{display:flex;justify-content:center;margin:0 0 var(--s5);cursor:pointer}.brand img{width:156px;height:auto;display:block}
.mbrand{display:none;align-items:center;cursor:pointer}.mbrand img{width:50px;height:auto;display:block}
.navs,.navb{display:flex;flex-direction:column;gap:var(--s1)}.sp{flex:1;min-height:var(--s3)}
.nv{justify-content:flex-start;gap:var(--s3);width:100%;padding:var(--s3) var(--s4);border:0;color:var(--mut);font-weight:600;text-align:left}
.nv .i{width:21px;height:21px}.nv:hover{color:var(--fg);background:var(--raise)}.nv.on{background:var(--raise);color:var(--acc)}
#content{margin-left:calc(var(--sbw) + var(--g)*2);margin-right:var(--rpm);transition:margin-right .34s var(--ease)}
#top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:var(--s3);align-items:center;padding:var(--s4) var(--s5) var(--s3);max-width:1760px;margin:0 auto}
#top .p{margin-left:auto;white-space:nowrap}
main{padding:var(--s2) var(--s5) calc(var(--npH) + var(--navH) + var(--s5));max-width:1760px;margin:0 auto}
body::after{content:'';position:fixed;left:0;right:0;bottom:0;height:var(--npH);background:var(--bg);z-index:8;pointer-events:none}

/* ===== Cards and grids ===== */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:var(--s5) var(--s4)}
.grid.lg{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:var(--s5)}
.card{cursor:pointer;min-width:0}
.card .art{position:relative;aspect-ratio:1;border-radius:var(--r-lg);overflow:hidden;margin-bottom:var(--s2);background:var(--card);outline:1px solid color-mix(in srgb,var(--fg) 7%,transparent);outline-offset:-1px;transition:transform .24s var(--ease),box-shadow .24s var(--ease)}
.card b,.t b,.t small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card b{font-weight:600;color:color-mix(in srgb,var(--fg) 86%,transparent);transition:color var(--t)}
.cc b{font-size:var(--fs-lg)}
.art img,.sm img,.big img,#nArt img{width:100%;height:100%;object-fit:contain;display:block}
.ph{width:100%;height:100%;display:grid;place-items:center;font-size:var(--fs-2xl);font-weight:700;color:var(--fg)}
.cpl{position:absolute;right:var(--s3);bottom:var(--s3);width:44px;height:44px;min-height:0;padding:0;border:0;border-radius:50%;background:color-mix(in srgb,var(--acc) 94%,transparent);color:var(--on-acc);box-shadow:0 6px 16px var(--sh);opacity:0;transform:translateY(6px);transition:opacity .18s,transform .18s var(--ease),background-color var(--t)}
.cpl:hover{background:var(--acc);transform:scale(1.06)}.cpl .i{width:20px;height:20px}
.card:hover .cpl,.card:focus-within .cpl,.cpl:focus-visible{opacity:1;transform:none}
@media(hover:hover){.card:hover .art{transform:translateY(-3px) scale(1.02);box-shadow:0 14px 28px var(--sh)}.card:hover b{color:var(--fg)}}
@media(hover:none){.cpl{display:none}}
.card:active .art{transform:scale(.98)}
.mos{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;width:100%;height:100%}.mos img{width:100%;height:100%;object-fit:cover}
.rec{display:flex;gap:var(--s4);overflow-x:auto;padding:var(--s2) 0 var(--s3);margin:calc(var(--s2)*-1) 0 calc(var(--s3)*-1);scrollbar-width:none;-ms-overflow-style:none;user-select:none}.rec::-webkit-scrollbar{display:none}
.rec .card{width:130px;flex:none}.rec2 .card{width:170px}
.rec img,.song img{-webkit-user-drag:none}
.rw{position:relative;--ah:130px}.rw.rec2{--ah:170px}.rw.jbrow{--ah:56px}
.rarr{position:absolute;top:calc(var(--ah)/2 - 20px);z-index:2;width:40px;height:40px;min-height:0;padding:0;border-radius:50%;background:color-mix(in srgb,var(--bg) 84%,transparent);border-color:var(--line);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 6px 18px var(--sh)}
.rarr.l{left:calc(var(--s3)*-1)}.rarr.r{right:calc(var(--s3)*-1)}.rarr .i{width:20px;height:20px}
.sh{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;margin:var(--s6) 0 var(--s3)}.sh h2{margin:0 var(--s2) 0 0;cursor:pointer}
.sech{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s3);flex-wrap:wrap;margin:var(--s6) 0 var(--s3)}.sech h2{margin:0}.sech .row{margin:0}.sech small{display:inline;margin-left:var(--s2)}

/* ===== Song rows ===== */
.song{display:flex;align-items:center;gap:var(--s3);padding:var(--s2);border-radius:var(--r-md);cursor:pointer;transition:background-color var(--t)}
.song:hover{background:color-mix(in srgb,var(--raise) 60%,transparent)}
.song.now,.song.picked{background:var(--raise)}.song.now{box-shadow:inset 3px 0 0 var(--acc)}.song.now b{color:var(--acc)}
.sm{position:relative;width:44px;height:44px;border-radius:var(--r-md);overflow:hidden;flex:none;background:var(--card)}
.t{flex:1;min-width:0}.t b{font-weight:600}
.dur{color:var(--mut);font-size:var(--fs-md);font-variant-numeric:tabular-nums;min-width:38px;text-align:right}
.tn{width:28px;text-align:right;color:var(--mut);font-size:var(--fs-md);font-variant-numeric:tabular-nums;flex:none}
.pc{display:inline-flex;align-items:center;gap:var(--s1);color:var(--mut);font-size:var(--fs-sm);min-width:36px;justify-content:flex-end;font-variant-numeric:tabular-nums}.pc .i{width:9px;height:9px;fill:currentColor;stroke:none}
.warn{display:inline-grid;place-items:center;width:14px;height:14px;border-radius:50%;background:var(--gold);color:var(--bg);font-size:9px;font-weight:700;margin-left:6px;vertical-align:1px;opacity:.8}
.fv{color:var(--gold);display:inline-flex}.fv .i{fill:currentColor;width:16px;height:16px}
.ck{display:none;width:20px;height:20px;border:2px solid var(--mut);border-radius:50%;flex:none}
body.selecting .ck{display:block}body.selecting .song .ic{visibility:hidden}.picked .ck{background:var(--acc);border-color:var(--acc)}
.ed{opacity:0}.song:hover .ed,.ed:focus-visible{opacity:1}
.eq{position:absolute;inset:0;display:flex;justify-content:center;gap:3px;background:rgba(8,26,18,.6)}
.eq i{width:3px;height:44%;margin-bottom:28%;align-self:flex-end;background:var(--acc);border-radius:2px;transform-origin:bottom;animation:eqb .9s ease-in-out infinite}
.eq i:nth-child(2){animation-duration:1.15s;animation-delay:-.35s}.eq i:nth-child(3){animation-duration:.75s;animation-delay:-.6s}
body:not(.playing) .eq i{animation-play-state:paused}
.keys .krow{padding:6px var(--s2) 6px 2px}.keys .kn{width:22px;text-align:center;color:var(--mut);font-variant-numeric:tabular-nums}
.grip{touch-action:none;cursor:grab}.krow.dragging{position:relative;z-index:5;background:var(--raise);box-shadow:0 10px 30px var(--sh);cursor:grabbing}
.kb.on{color:var(--gold)}.kb .i{width:18px;height:18px}
.orow{padding:var(--s1) 2px}.orow .t{flex:1}
.dropOn{outline:2px solid var(--acc);outline-offset:3px}.dropT{box-shadow:0 -2px 0 var(--acc)}.dropB{box-shadow:0 2px 0 var(--acc)}
.dragimg{position:fixed;top:-200px;left:0;padding:var(--s2) var(--s3);border-radius:var(--r-md);background:var(--acc);color:var(--on-acc);font-weight:600;white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}
#dz{position:fixed;inset:12px;z-index:50;border:3px dashed var(--acc);border-radius:var(--r-xl);background:color-mix(in srgb,var(--bg) 82%,transparent);display:grid;place-items:center;font-size:var(--fs-xl);font-weight:700;pointer-events:none;animation:fadeIn .15s}

/* ===== Headers, bars, chips, info panels ===== */
.phd{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);flex-wrap:wrap;margin:var(--s5) 0 var(--s2)}
.row{display:flex;gap:var(--s2);flex-wrap:wrap;margin-top:var(--s3)}
.bar{display:flex;gap:var(--s3);align-items:center;justify-content:space-between;flex-wrap:wrap;margin:var(--s3) 0 0}.bar>h2{margin:0}.bar:has(>h2){margin:var(--s6) 0 var(--s3)}
.hd{display:flex;gap:var(--s5);align-items:flex-end;margin:var(--s3) 0 var(--s2);flex-wrap:wrap}
.big{width:160px;height:160px;border-radius:var(--r-lg);overflow:hidden;background:var(--card)}
.desc{margin:var(--s2) 0;max-width:46em;color:var(--mut);white-space:pre-wrap}
.empty{text-align:center;padding:var(--s7) var(--s3)}
.lnk{cursor:pointer;color:var(--acc)}.lnk:hover{text-decoration:underline}.lnk2{cursor:pointer}.lnk2:hover{text-decoration:underline}
.chips{display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center;margin:var(--s1) 0}
.chip{display:inline-flex;align-items:center;gap:6px;padding:var(--s1) var(--s3);border-radius:var(--r-sm);font-size:var(--fs-sm);font-weight:600;border:1px solid var(--line);color:var(--mut);background:transparent;white-space:nowrap;transition:background-color var(--t),color var(--t),border-color var(--t)}
.chip[data-act]{cursor:pointer}.chip[data-act]:hover{background:var(--raise);color:var(--fg)}
.chip.on,.chip.on:hover{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}.chip .i{width:14px;height:14px}
.banner{display:flex;align-items:center;gap:var(--s2);background:color-mix(in srgb,var(--gold) 12%,transparent);border:1px solid color-mix(in srgb,var(--gold) 40%,transparent);border-radius:var(--r-md);padding:var(--s2) var(--s4);font-size:var(--fs-md);cursor:pointer;margin:var(--s3) 0 0;width:fit-content}.banner .i{color:var(--gold);width:16px;height:16px}
.resume{display:flex;align-items:center;gap:var(--s4);background:var(--card);border-radius:var(--r-lg);padding:var(--s3) var(--s4);margin:var(--s5) 0 0}.resume .sm{width:56px;height:56px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s6)}.two>div{min-width:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:var(--s3);margin:var(--s4) 0}
.kpi{background:var(--card);border-radius:var(--r-lg);padding:var(--s4) var(--s5)}.kpi b{display:block;font-size:var(--fs-xl);margin-top:2px}
.info{background:var(--card);border-radius:var(--r-lg);padding:var(--s5);margin:var(--s5) 0 0}.info h2{margin:0 0 var(--s3)}
.igrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:var(--s4) var(--s5)}.inf small{display:block}.inf b{display:block;font-weight:600;margin-top:2px}
.aw{display:flex;gap:var(--s2);align-items:center;color:var(--gold);padding:5px 0;font-size:var(--fs-md)}.aw .i{width:17px;height:17px}.awl{margin-top:var(--s4);border-top:1px solid var(--line);padding-top:var(--s3)}
.ah{display:flex;align-items:baseline;gap:var(--s2);margin:var(--s5) 0 6px}.ah h2{margin:0}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:0 var(--s3)}.isAlbum .gonly,.isGame .aonly{display:none}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:var(--s3)}
.tile{background:var(--card);border-radius:var(--r-lg);padding:var(--s4);cursor:pointer;display:flex;flex-direction:column;gap:3px;transition:background-color var(--t),transform .15s}
.tile:hover{background:var(--raise)}.tile .i{width:26px;height:26px;color:var(--acc);margin-bottom:var(--s2)}.tile.on{outline:2px solid var(--acc)}.tile b{font-size:var(--fs-lg)}
.exq{width:100%;margin-top:6px;padding:var(--s3) var(--s4);background:var(--card)}
.kap{width:120px;height:60px;border-radius:var(--r-md);overflow:hidden;background:var(--bg);flex:none}.kap img{width:100%;height:100%;object-fit:cover}
.setg{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:var(--s4);margin-top:var(--s4)}
.set{background:var(--card);border-radius:var(--r-lg);padding:var(--s5)}.set h3{margin-bottom:var(--s2);font-size:var(--fs-lg)}.set p{margin:0 0 var(--s3)}.set .row{margin-top:6px}
.set select{margin:var(--s1) 0 var(--s2);max-width:100%}
.srow{display:flex;justify-content:space-between;gap:var(--s3);padding:var(--s2) 0;border-bottom:1px solid var(--line);font-size:var(--fs-md)}
.chart{display:flex;align-items:flex-end;justify-content:flex-start;gap:var(--s2);height:150px;margin:var(--s4) 0 var(--s1)}
.chart .col{flex:1;max-width:90px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.chart .col i{display:block;width:100%;background:var(--acc);border-radius:var(--r-sm) var(--r-sm) 0 0;min-height:2px}.chart small{font-size:var(--fs-xs);margin-top:var(--s1)}
.chart.daily{gap:3px;height:140px}.chart.daily .col{max-width:none}.chart.daily .col i{border-radius:var(--s1) var(--s1) 0 0}
.brow{display:grid;grid-template-columns:40px minmax(110px,230px) 1fr auto;gap:var(--s3);align-items:center;padding:6px 0;font-size:var(--fs-md)}
.brow .th{width:36px;height:36px;border-radius:var(--r-sm);overflow:hidden;background:var(--card)}.brow .th img{width:100%;height:100%;object-fit:contain;display:block}
.brow .tr{height:6px;border-radius:3px;background:var(--line);overflow:hidden}.brow .tr i{display:block;height:100%;background:color-mix(in srgb,var(--acc) 45%,var(--line))}.brow.top .tr i{background:var(--acc)}
.brow[data-act]{cursor:pointer}.brow[data-act]:hover>span{text-decoration:underline}

/* ===== Menus, dialogs, toast ===== */
#sheet{position:fixed;inset:0;z-index:20}
.bk{position:absolute;inset:0;background:rgba(4,12,8,.6);animation:fadeIn .2s ease}
.pn{position:absolute;left:0;right:0;bottom:0;max-height:82vh;overflow:auto;background:var(--card);border-radius:var(--r-xl) var(--r-xl) 0 0;padding:var(--s5) var(--s5) calc(var(--s5) + env(safe-area-inset-bottom));max-width:560px;margin:auto;animation:sheetUp .28s var(--ease)}
.pn h3{margin-bottom:var(--s3);font-size:var(--fs-lg)}
.pn input:not([type=checkbox]),.pn select,.pn textarea{width:100%;margin:var(--s1) 0 var(--s3)}
.pn input.num{width:68px;margin:0 0 0 6px;padding:var(--s2);text-align:center}
.pop{position:fixed;z-index:40;min-width:210px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:0 12px 34px var(--sh);padding:var(--s1);animation:popIn .15s ease-out;transform-origin:top right}
.pop .mi{margin:0}
#toast{position:fixed;top:calc(70px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:var(--s2) var(--s4);border-radius:var(--r-md);opacity:0;transition:.2s;z-index:30;pointer-events:none;font-weight:500}
#selbar{position:fixed;left:var(--s2);right:var(--s2);bottom:calc(var(--npH) + var(--navH) + var(--s1));max-width:700px;margin:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:0 6px 24px var(--sh);display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:var(--s2);z-index:8}#selN{margin-right:auto;font-weight:600}
body.selecting #npbar{display:none}

/* ===== Hero (featured + detail pages) ===== */

 if(c.startsWith('artist:'))return all().filter(s=>(s.artist||'Unknown artist')==c.slice(7)).map(s=>s.id).sort(byTitle);
 if(c=='search')return S.found||[];const l=getList(c);if(l&&l.type=='series')return serSongs(l).filter(i=>songs.has(i));return l?sortSongs(l.songs.filter(i=>songs.has(i)),getSort(l),l):[]}

/* ---------- sync with the home server ---------- */
let cfg={},tomb={},haveBlob=new Set(),syncing=0,lastSync=0,activeBase='',srvSeq=0,lastPush=0;
const bases=()=>(cfg.url||'').split(',').map(s=>s.trim().replace(/\/+$/,'')).filter(Boolean);
async function findServer(){for(const b of bases()){const c=new AbortController(),tm=setTimeout(()=>c.abort(),4000);try{const r=await fetch(b+'/api/ping',{headers:{Authorization:'Bearer '+cfg.token},signal:c.signal});clearTimeout(tm);if(r.ok||r.status==401)return activeBase=b}catch{clearTimeout(tm)}}return''}
const saveCfg=()=>put('meta',{id:'cfg',...cfg}),saveTomb=()=>put('meta',{id:'tomb',map:tomb}),saveSyncState=()=>put('meta',{id:'syncstate',seq:srvSeq,push:lastPush});
const mime=fn=>/\.wav$/i.test(fn)?'audio/wav':/\.m4a$/i.test(fn)?'audio/mp4':/\.(ogg|oga|opus)$/i.test(fn)?'audio/ogg':'audio/mpeg';
const strip=({cover,...r})=>r;
const imgBlob=buf=>{const u=new Uint8Array(buf,0,4);return new Blob([buf],{type:u[0]==0x89?'image/png':u[0]==0x47?'image/gif':u[0]==0x52?'image/webp':'image/jpeg'})};
async function sync(manual){
 if(!cfg.url||syncing)return;syncing=1;
 try{if(await syncOnce(manual)=='reset')await syncOnce(manual)}finally{syncing=0;render();setTimeout(analyseAll,1500)}}
/* Delta sync: only records changed on this device since the last sync are sent, and only records
   changed on the server since 'srvSeq' (its change counter) come back. Audio and covers are matched by id. */
async function syncOnce(manual){
 let base='';const api=(p,o={})=>fetch(base+p,{...o,headers:{Authorization:'Bearer '+cfg.token,...(o.headers||{})}});
 try{
  base=await findServer();if(!base)throw new Error('offline');if(manual)toast('Syncing…');
  if(lists.some(l=>(l.mod||0)>=lastPush)){try{const pr=await api('/api/state');if(pr.ok)await mergeRemoteLists((await pr.json()).lists)}catch{}}   /* see what the server already holds before sending, so its newer sections are merged, not overwritten */
  const t0=Date.now(),dS={},dL={},dT={};
  for(const s of songs.values())if((s.mod||0)>=lastPush)dS[s.id]=strip(s);
  for(const l of lists)if((l.mod||0)>=lastPush)dL[l.id]=l;
  for(const[id,ts]of Object.entries(tomb))if(ts>=lastPush)dT[id]=ts;
  const r=await api('/api/state',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({songs:dS,lists:dL,tomb:dT,since:srvSeq})});
  if(r.status==401)throw new Error('Wrong access token');if(!r.ok)throw new Error('Server error '+r.status);
  const m=await r.json();
  if(m.reset){srvSeq=0;lastPush=0;await saveSyncState();return'reset'}   /* the server was reset or restored: send everything again */
  for(const[id,r0]of Object.entries(m.songs||{})){const rec=cleanSong(r0);if(!rec)continue;const s=songs.get(id);
   if(tomb[id]&&rec.mod>tomb[id])delete tomb[id];
   if(!s){const n={...rec,cover:null,cmod:0};songs.set(id,n);await put('songs',n)}
   else{const o=mergeSong(s,rec);let c=s.cover;if(o.cvh&&o.cvh!==s.cvh)c=COV.get(o.cvh)||null;const cm=s.cmod||0;Object.assign(s,o,{cover:c,cmod:cm});SNAP.set(id,TRK.map(k=>jv(s[k])));bump('songs');await putSong(s)}}
  for(const l0 of Object.values(m.lists||{})){const l=cleanList(l0);if(!l)continue;if(tomb[l.id]&&l.mod>tomb[l.id])delete tomb[l.id];const ix=lists.findIndex(x=>x.id==l.id);
   if(ix<0){lists.push(l);await put('lists',l)}else{const M=mergeList(lists[ix],l);if(sj(M)!==sj(lists[ix])){lists[ix]=M;await put('lists',M)}}}
  for(const[id,ts]of Object.entries(m.tomb||{})){if(!okId(id))continue;
   const s=songs.get(id);if(s&&(s.mod||0)<=ts){songs.delete(id);haveBlob.delete(id);await del('songs',id);await del('blobs',id)}
   const li=lists.findIndex(x=>x.id==id);if(li>=0&&(lists[li].mod||0)<=ts){lists.splice(li,1);await del('lists',id)}
   if(ts>(tomb[id]||0))tomb[id]=ts}
  srvSeq=m.seq;lastPush=t0;await saveSyncState();await saveTomb();await gcCovers();
  render();try{await syncLog(api)}catch{}
  /* song covers are shared: one file per distinct picture, named by its hash */
  const srvC=m.covers||{},want=new Set(),legacy=[];let cv=0;
  for(const s of songs.values()){if(s.cvh){const b=COV.get(s.cvh);if(b){if(s.cover!==b){s.cover=b;cv++}}else if(srvC[s.cvh])want.add(s.cvh)}else if(!s.cover&&srvC[s.id])legacy.push(s)}
  for(const h of want){const c=await api('/api/cover/'+h);if(!c.ok)continue;const b=imgBlob(await c.arrayBuffer());await putCover(h,b);for(const s of songs.values())if(s.cvh==h)s.cover=b;if(++cv%15==0)render()}
  for(const s of legacy){const c=await api('/api/cover/'+s.id);if(!c.ok)continue;s.cover=imgBlob(await c.arrayBuffer());s.cmod=srvC[s.id];s.mod=Date.now();await put('songs',s);cv++}
  const upH=[...new Set([...songs.values()].filter(s=>s.cvh&&COV.has(s.cvh)&&!srvC[s.cvh]).map(s=>s.cvh))];
  for(const h of upH)await api(`/api/cover/${h}?cmod=1`,{method:'PUT',body:COV.get(h)});
  if(cv){await gcCovers();artKey='';paint();render()}
  for(const l of lists){if(l.type!='collection'&&l.type!='series')continue;const loc=ART.get(l.id),rc=srvC[l.id]||0,lc=loc?loc.cmod:0;
   if(!l.acmod){if(loc){ART.delete(l.id);await del('art',l.id)}continue}
   if(lc==l.acmod&&rc<l.acmod)await api(`/api/cover/${l.id}?cmod=${l.acmod}`,{method:'PUT',body:loc.blob});
   else if(lc<l.acmod&&rc>0){const c=await api('/api/cover/'+l.id);if(c.ok){const b=imgBlob(await c.arrayBuffer());ART.set(l.id,{blob:b,cmod:l.acmod});await put('art',{id:l.id,blob:b,cmod:l.acmod})}}}
  const have=new Set(m.files),up=[...haveBlob].filter(id=>songs.has(id)&&!have.has(id));let i=0;
  for(const id of up){toast(`Uploading ${++i} of ${up.length}`);const b=await idb('blobs','readonly',st=>st.get(id));if(b)await api('/api/audio/'+id,{method:'PUT',body:b.file})}
  const dn=cfg.dl===false?[]:[...songs.keys()].filter(id=>!haveBlob.has(id)&&have.has(id));i=0;
  for(const id of dn){toast(`Downloading ${++i} of ${dn.length}`);const a=await api('/api/audio/'+id);if(!a.ok)continue;const s=songs.get(id);
   await put('blobs',{id,file:new File([await a.blob()],s.fn,{type:mime(s.fn)})});haveBlob.add(id);if(i%10==0)render()}
  lastSync=Date.now();render();if(manual||up.length||dn.length)toast('Sync complete');
 }catch(e){if(e.message=='Wrong access token'||e.message.startsWith('Server error'))toast(e.message);else if(manual)toast('Server not reachable, so nothing was synced')}}
