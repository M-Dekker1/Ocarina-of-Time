<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link rel="manifest" href="manifest.webmanifest">

<style>
:root{--bg:#f6f7f9;--fg:#15171c;--mut:#737985;--card:#fff;--line:#e3e6ec;--acc:#3d5afe;--sh:rgba(20,30,60,.12)}
:root[data-theme=dark]{--bg:#101215;--fg:#eef0f4;--mut:#929aa8;--card:#191c21;--line:#272b32;--acc:#8ea2ff;--sh:rgba(0,0,0,.55)}
@media(prefers-color-scheme:dark){:root:not([data-theme]){--bg:#101215;--fg:#eef0f4;--mut:#929aa8;--card:#191c21;--line:#272b32;--acc:#8ea2ff;--sh:rgba(0,0,0,.55)}}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif;padding-top:env(safe-area-inset-top)}
h1,h2,h3{margin:0}h2{font-size:17px;margin:22px 0 10px}h1{font-size:26px}
button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer}
button.p{background:var(--acc);border-color:var(--acc);color:var(--bg)}
.ic{border:0;background:none;padding:6px 10px;font-size:19px;line-height:1}
label{font-size:12px;color:var(--mut)}small,.mut{color:var(--mut)}small{display:block}
header{position:sticky;top:env(safe-area-inset-top);z-index:5;background:var(--bg);display:flex;gap:8px;align-items:center;padding:10px 16px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.logo{font-size:19px;margin-right:auto;letter-spacing:-.02em}
#q{flex:1 1 220px;min-width:150px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit}
nav{display:flex;gap:4px;padding:10px 16px 0;max-width:1100px;margin:auto}
.tab{border:0;background:none;color:var(--mut);font-weight:600}.tab.on{color:var(--fg);background:var(--card);border:1px solid var(--line)}
main{padding:6px 16px 130px;max-width:1100px;margin:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:18px}
.card{cursor:pointer;min-width:0}.card .art{aspect-ratio:1;border-radius:8px;overflow:hidden;margin-bottom:7px;border:1px solid var(--line)}
.card b,.t b,.t small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.art img,.sm img,.big img,#nArt img{width:100%;height:100%;object-fit:contain;display:block}
.sm,.big,#nArt,.card .art{background:var(--card)}
.dur{color:var(--mut);font-size:13px;font-variant-numeric:tabular-nums;min-width:38px;text-align:right}
.ph{width:100%;height:100%;display:grid;place-items:center;font-size:28px;font-weight:700;color:#fff}
.song{display:flex;align-items:center;gap:12px;padding:6px 6px;border-radius:8px;cursor:pointer}.song:hover{background:var(--card)}
.sm{width:44px;height:44px;border-radius:6px;overflow:hidden;flex:none}
.t{flex:1;min-width:0}
.warn{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:#f5a524;color:#000;font-size:11px;font-weight:700;margin-left:6px;vertical-align:1px}
.hd{display:flex;gap:18px;align-items:flex-end;margin:10px 0 8px;flex-wrap:wrap}.big{width:160px;height:160px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
#mini{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));max-width:700px;margin:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 6px 24px var(--sh);display:flex;align-items:center;gap:10px;padding:8px;z-index:6;cursor:pointer;overflow:hidden}
#mBar{position:absolute;left:0;bottom:0;height:2px;background:var(--acc);width:0}
#np{position:fixed;inset:0;background:var(--bg);z-index:10;overflow:auto;padding:calc(10px + env(safe-area-inset-top)) 20px 30px}
.npw{max-width:420px;margin:auto;text-align:center}
#nArt{width:min(100%,360px);aspect-ratio:1;margin:10px auto 16px;border-radius:14px;overflow:hidden;box-shadow:0 12px 40px var(--sh)}
input[type=range]{width:100%;accent-color:var(--acc)}
.tm{display:flex;justify-content:space-between;color:var(--mut);font-size:12px}
.ctl{display:flex;justify-content:center;align-items:center;gap:12px;margin:8px 0}.ctl .ic{font-size:26px}.ic.on{color:var(--acc)}
#stars span{font-size:26px;cursor:pointer;color:var(--mut)}#stars span.on{color:#f5a524}
#sheet{position:fixed;inset:0;z-index:20}.bk{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.pn{position:absolute;left:0;right:0;bottom:0;max-height:82vh;overflow:auto;background:var(--bg);border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-width:560px;margin:auto}
.pn h3{margin-bottom:10px}
.mi{display:block;width:100%;text-align:left;margin:5px 0}
.pn input:not([type=checkbox]),.pn select{width:100%;padding:9px;margin:4px 0 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);font:inherit}
.pk{display:flex;align-items:center;gap:8px;padding:6px 0}.pk small{display:inline;margin-left:6px}
#toast{position:fixed;top:calc(70px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:20px;opacity:0;transition:.2s;z-index:30;pointer-events:none}
.empty{text-align:center;padding:60px 10px}
</style></head><body>
<header><h1 class="logo">Ocarina of Time</h1><input id="q" type="search" placeholder="Search songs and playlists"><button data-act="addfiles" class="p">Add songs</button><button data-act="newList">New</button><button class="ic" data-act="more" title="More">⋯</button></header>
<nav><button class="tab on" data-t="home">Library</button><button class="tab" data-t="songs">Songs</button><button class="tab" data-t="artists">Artists</button></nav>
<main id="main"></main>
<div id="mini" hidden><div class="sm" id="mArt"></div><div class="t" id="mT"></div><button class="ic" id="mPrev">⏮</button><button class="ic" id="mPlay">▶</button><button class="ic" id="mNext">⏭</button><i id="mBar"></i></div>
<section id="np" hidden><div class="npw">
<div style="text-align:left"><button class="ic" id="nClose">⌄</button></div>
<div id="nArt"></div><h2 id="nT" style="margin:4px 0"></h2><small id="nA"></small>
<input type="range" id="nSeek" min="0" max="1" step="1" value="0"><div class="tm"><span id="nCur">0:00</span><span id="nDur">0:00</span></div>
<div class="ctl"><button class="ic" id="nShuf">⤨</button><button class="ic" id="nPrev">⏮</button><button class="ic" id="nPlay" style="font-size:34px">▶</button><button class="ic" id="nNext">⏭</button><button class="ic" id="nRep">⟲</button></div>
<div class="ctl"><button class="ic" id="nFav">♡</button><span id="stars"><span data-act="rate" data-n="1">★</span><span data-act="rate" data-n="2">★</span><span data-act="rate" data-n="3">★</span><span data-act="rate" data-n="4">★</span><span data-act="rate" data-n="5">★</span></span></div>
<div class="ctl"><small>Volume</small><input type="range" id="vol" min="0" max="1" step=".01" value="1" style="width:55%"></div>
<h3 style="text-align:left;margin-top:18px">Up next</h3><div id="nQ" style="text-align:left"></div></div></section>
<div id="sheet" hidden></div><div id="toast"></div>
<input type="file" id="file" multiple accept="audio/*,.mp3,.wav,.ogg" hidden>
<input type="file" id="dir" webkitdirectory multiple hidden>
<input type="file" id="imp" accept=".json,application/json" hidden>
<script>
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let db,songs=new Map(),lists=[],S={t:'home'},hist=[];
/* ---------- storage (IndexedDB) ---------- */
const open=()=>new Promise((res,rej)=>{const r=indexedDB.open('tunebox',1);r.onupgradeneeded=()=>['songs','blobs','lists'].forEach(n=>r.result.createObjectStore(n,{keyPath:'id'}));r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)});
const idb=(st,mode,fn)=>new Promise((res,rej)=>{const tx=db.transaction(st,mode),r=fn(tx.objectStore(st));tx.oncomplete=()=>res(r&&r.result);tx.onerror=()=>rej(tx.error)});
const put=(st,o)=>idb(st,'readwrite',s=>s.put(o)),del=(st,id)=>idb(st,'readwrite',s=>s.delete(id));
/* ---------- helpers ---------- */
const h53=s=>{let a=3735928559,b=1103547991;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677)}a=Math.imul(a^a>>>16,2246822507)^Math.imul(b^b>>>13,3266489909);b=Math.imul(b^b>>>16,2246822507)^Math.imul(a^a>>>13,3266489909);return(4294967296*(2097151&b)+(a>>>0)).toString(36)};
const rnd=()=>Math.random().toString(36).slice(2,8),all=()=>[...songs.values()];
const ttl=s=>s.title||s.fn.replace(/\.[^.]+$/,''),needs=s=>!s.title||!s.artist||!s.album||!s.cover;
const hue=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h};
const art=(u,n)=>u?`<img loading="lazy" src="${u}" alt="">`:`<div class="ph" style="background:hsl(${hue(n||'?')},42%,40%)">${esc((n||'?')[0].toUpperCase())}</div>`;
const urls=new Map(),cu=s=>{if(!s.cover)return'';if(!urls.has(s.id))urls.set(s.id,URL.createObjectURL(s.cover));return urls.get(s.id)};
const lcover=l=>{const s=l.songs.map(i=>songs.get(i)).find(s=>s&&s.cover);return s?cu(s):''};
const fm=x=>isFinite(x)?(x/60|0)+':'+String(x%60|0).padStart(2,'0'):'0:00';
let tt;const toast=m=>{const e=$('#toast');e.textContent=m;e.style.opacity=1;clearTimeout(tt);tt=setTimeout(()=>e.style.opacity=0,2000)};
const byTitle=(a,b)=>ttl(songs.get(a)).localeCompare(ttl(songs.get(b)));
/* ---------- tag reading ---------- */
const dec=(b,e)=>{try{let t;if(e==1)t=new TextDecoder(b[0]==254&&b[1]==255?'utf-16be':'utf-16le').decode(b);else t=new TextDecoder(e==2?'utf-16be':e==3?'utf-8':'iso-8859-1').decode(b);return t.replace(/\uFEFF|\0/g,'').trim()}catch{return''}};
async function id3(f){const o={},hd=new Uint8Array(await f.slice(0,10).arrayBuffer());
 if(String.fromCharCode(...hd.slice(0,3))!='ID3'||hd[3]<3)return o;
 const v=hd[3],sz=((hd[6]&127)<<21)|((hd[7]&127)<<14)|((hd[8]&127)<<7)|(hd[9]&127);
 const b=new Uint8Array(await f.slice(10,10+sz).arrayBuffer()),dv=new DataView(b.buffer);let p=0;
 while(p+10<=b.length){const id=String.fromCharCode(...b.slice(p,p+4));if(!/^[A-Z0-9]{4}$/.test(id))break;
  const fs=v==4?((b[p+4]&127)<<21)|((b[p+5]&127)<<14)|((b[p+6]&127)<<7)|(b[p+7]&127):dv.getUint32(p+4);
  const d=b.slice(p+10,p+10+fs);p+=10+fs;
  if(id=='TIT2')o.title=dec(d.slice(1),d[0]);else if(id=='TPE1')o.artist=dec(d.slice(1),d[0]);else if(id=='TALB')o.album=dec(d.slice(1),d[0]);
  else if(id=='TRCK')o.trk=parseInt(dec(d.slice(1),d[0]))||0;
  else if(id=='APIC'&&!o.cover){const e=d[0];let i=1;while(d[i])i++;const mime=String.fromCharCode(...d.slice(1,i));i+=2;
   if(e==1||e==2){while(i<d.length&&!(d[i]==0&&d[i+1]==0))i+=2;i+=2}else{while(i<d.length&&d[i])i++;i++}
   o.cover=new Blob([d.slice(i)],{type:mime.includes('/')?mime:'image/'+mime.toLowerCase()})}}
 return o}
async function ogg(f){const o={},b=new Uint8Array(await f.slice(0,262144).arrayBuffer());
 const find=s=>{const n=[...s].map(c=>c.charCodeAt(0));outer:for(let i=0;i<b.length-n.length;i++){for(let j=0;j<n.length;j++)if(b[i+j]!=n[j])continue outer;return i+n.length}return -1};
 let p=find('\x03vorbis');if(p<0)p=find('OpusTags');if(p<0)return o;
 const dv=new DataView(b.buffer);p+=4+dv.getUint32(p,true);const n=dv.getUint32(p,true);p+=4;
 for(let i=0;i<n&&p+4<b.length;i++){const l=dv.getUint32(p,true);p+=4;const t=new TextDecoder().decode(b.slice(p,p+l));p+=l;const k=t.indexOf('=');
  if(k>0){const key=t.slice(0,k).toLowerCase(),val=t.slice(k+1).trim();if(key=='title')o.title=val;if(key=='artist')o.artist=val;if(key=='album')o.album=val;if(key=='tracknumber')o.trk=parseInt(val)||0}}
 return o}
async function addFiles(files){let n=0;
 for(const f of files){if(!/\.(mp3|wav|ogg|oga|opus)$/i.test(f.name))continue;const id=h53(f.name+f.size);if(songs.has(id))continue;
  let t={};try{t=/\.mp3$/i.test(f.name)?await id3(f):/\.(ogg|oga|opus)$/i.test(f.name)?await ogg(f):{}}catch{}
  const dur=await getDur(f);const s={id,fn:f.name,dur,title:t.title||'',artist:t.artist||'',album:t.album||'',trk:t.trk||0,cover:t.cover||null,fav:0,rating:0,plays:0,added:Date.now(),mod:Date.now()};
  songs.set(id,s);await put('songs',s);await put('blobs',{id,file:f});n++;if(n%5==0)toast('Adding… '+n)}
 toast(n?`Added ${n} song${n>1?'s':''}`:'Nothing new to add');render()}
const getDur=f=>new Promise(res=>{const a=new Audio(),u=URL.createObjectURL(f);const done=d=>{a.src='';URL.revokeObjectURL(u);res(isFinite(d)&&d>0?d:0)};a.preload='metadata';a.onloadedmetadata=()=>done(a.duration);a.onerror=()=>done(0);setTimeout(()=>done(0),3000);a.src=u});
async function backfill(){let fails=0,n=0;for(const s of all()){if(s.dur||fails>=3)continue;const b=await idb('blobs','readonly',st=>st.get(s.id));if(!b)continue;s.dur=await getDur(b.file);if(s.dur){fails=0;await put('songs',s);if(++n%25==0)render()}else fails++}if(n)render()}
async function fitCover(f){try{const b=await createImageBitmap(f),k=Math.min(1,800/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=Math.round(b.width*k);c.height=Math.round(b.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(b,0,0,c.width,c.height);return await new Promise(r=>c.toBlob(o=>r(o||f),'image/jpeg',.9))}catch{return f}}
/* ---------- collections & playlists ---------- */
function colls(){const m=new Map();
 for(const s of songs.values())if(s.album){if(!m.has(s.album))m.set(s.album,{id:'a:'+s.album,name:s.album,type:'collection',auto:1,songs:[]});m.get(s.album).songs.push(s)}
 const auto=[...m.values()].sort((a,b)=>a.name.localeCompare(b.name)).map(c=>({...c,songs:c.songs.sort((a,b)=>a.trk-b.trk||ttl(a).localeCompare(ttl(b))).map(s=>s.id)}));
 const out=[{id:'all',name:'All Songs',type:'collection',auto:1,songs:all().map(s=>s.id).sort(byTitle)}];
 const fav=all().filter(s=>s.fav).map(s=>s.id).sort(byTitle);if(fav.length)out.push({id:'fav',name:'Favourites',type:'collection',auto:1,songs:fav});
 return[...out,...auto,...lists.filter(l=>l.type=='collection')]}
const pls=()=>lists.filter(l=>l.type=='playlist'),getList=id=>colls().find(c=>c.id==id)||lists.find(l=>l.id==id);
function sub(p,cs){const set=new Set(p.songs);if(!set.size)return'';let best=null;
 for(const c of cs){if(c.id=='all'||c.id=='fav')continue;const cset=new Set(c.songs);if([...set].every(x=>cset.has(x))&&(!best||c.songs.length<best.songs.length))best=c}
 return best?best.name:''}
function ctxIds(c){if(c.startsWith('artist:'))return all().filter(s=>(s.artist||'Unknown artist')==c.slice(7)).map(s=>s.id).sort(byTitle);
 if(c=='search')return S.found||[];const l=getList(c);return l?l.songs.filter(i=>songs.has(i)):[]}
/* ---------- views ---------- */
const card=(id,name,subt,cover,act='go')=>`<div class="card" data-act="${act}" data-id="${esc(id)}"><div class="art">${art(cover,name)}</div><b>${esc(name)}</b><small>${esc(subt||'')}&nbsp;</small></div>`;
const row=(id,ctx)=>{const s=songs.get(id);return`<div class="song" data-act="play" data-id="${id}" data-ctx="${esc(ctx)}"><div class="sm">${art(cu(s),ttl(s))}</div><div class="t"><b>${esc(ttl(s))}${needs(s)?'<span class="warn" title="Needs info">!</span>':''}</b><small>${esc(s.artist||'Unknown artist')}${s.album?' · '+esc(s.album):''}</small></div>${s.fav?'<span class="on" style="color:var(--acc)">♥</span>':''}<span class="dur">${s.dur?fm(s.dur):''}</span><button class="ic" data-act="smenu" data-id="${id}" data-ctx="${esc(ctx)}">⋯</button></div>`};
function vHome(){if(!songs.size&&!lists.length)return'<div class="empty"><h2>Your library is empty</h2><p class="mut">Add MP3, WAV or OGG files. On iPhone they need to be in the Files app (iCloud Drive, OneDrive or Google Drive).</p><button class="p" data-act="addfiles">Add songs</button></div>';
 const cs=colls(),ps=pls();
 return`<h2>Playlists</h2><div class="grid">${ps.map(p=>card(p.id,p.name,sub(p,cs)||`${p.songs.length} songs`,lcover(p))).join('')||'<p class="mut">No playlists yet. Tap New to make one.</p>'}</div><h2>Collections</h2><div class="grid">${cs.map(c=>card(c.id,c.name,`${c.songs.length} songs`,lcover(c))).join('')}</div>`}
function vList(){const cs=colls(),l=getList(S.id);if(!l)return'<button data-act="back">Back</button><p>Not found.</p>';
 const own=lists.find(x=>x.id==l.id),ids=l.songs.filter(i=>songs.has(i)),id=esc(l.id);
 let h=`<button class="ic" data-act="back">← Back</button><div class="hd"><div class="big">${art(lcover(l),l.name)}</div><div><small>${l.type=='collection'?'Collection':'Playlist'}${l.auto&&!['all','fav'].includes(l.id)?' (auto)':''}</small><h1>${esc(l.name)}</h1><small>${ids.length} songs</small><div class="row"><button class="p" data-act="plall" data-id="${id}">Play</button><button data-act="shuf" data-id="${id}">Shuffle</button>${own?`<button data-act="addsongs" data-id="${id}">Add songs</button><button data-act="lmenu" data-id="${id}">⋯</button>`:''}</div></div></div>`;
 if(l.type=='collection'){const set=new Set(l.songs);
  const ps=pls().filter(p=>l.id=='all'||p.songs.some(x=>set.has(x))).map(p=>({p,s:sub(p,cs)})).sort((a,b)=>!!b.s-!!a.s||a.p.name.localeCompare(b.p.name));
  h+=`<h2>Playlists</h2><div class="grid">${ps.map(x=>card(x.p.id,x.p.name,x.s,lcover(x.p))).join('')||'<p class="mut">No playlists use songs from this collection yet.</p>'}</div>`}
 return h+'<h2>Songs</h2>'+(ids.map(i=>row(i,l.id)).join('')||'<p class="mut">No songs yet.</p>')}
function vSongs(){const ids=ctxIds('all');return`<h2>${ids.length} songs</h2>`+ids.map(i=>row(i,'all')).join('')}
const artistsMap=()=>{const m=new Map();for(const s of songs.values()){const a=s.artist||'Unknown artist';if(!m.has(a))m.set(a,[]);m.get(a).push(s)}return[...m].sort((a,b)=>a[0].localeCompare(b[0]))};
function vArtists(){return`<h2>Artists</h2><div class="grid">${artistsMap().map(([a,ss])=>card(a,a,ss.length+' songs',(ss.find(s=>s.cover)?cu(ss.find(s=>s.cover)):''),'artist')).join('')}</div>`}
function vArtist(){const c='artist:'+S.id,ids=ctxIds(c);return`<button class="ic" data-act="back">← Back</button><div class="hd"><div><h1>${esc(S.id)}</h1><small>${ids.length} songs</small><div class="row"><button class="p" data-act="plall" data-id="${esc(c)}">Play</button><button data-act="shuf" data-id="${esc(c)}">Shuffle</button></div></div></div>`+ids.map(i=>row(i,c)).join('')}
function vSearch(){const q=S.q.toLowerCase(),ids=all().filter(s=>(ttl(s)+' '+s.artist+' '+s.album).toLowerCase().includes(q)).sort((a,b)=>ttl(a).localeCompare(ttl(b))).map(s=>s.id).slice(0,200);S.found=ids;
 const ls=[...pls(),...colls().filter(c=>c.id!='all'&&c.id!='fav')].filter(l=>l.name.toLowerCase().includes(q)),cs=colls();
 return`<h2>Playlists and collections</h2><div class="grid">${ls.map(l=>card(l.id,l.name,l.type=='playlist'?sub(l,cs):'Collection',lcover(l))).join('')||'<p class="mut">No matches.</p>'}</div><h2>Songs</h2>`+(ids.map(i=>row(i,'search')).join('')||'<p class="mut">No matches.</p>')}
function render(){$$('.tab').forEach(t=>t.classList.toggle('on',!S.q&&(t.dataset.t==S.t||(S.t=='list'&&t.dataset.t=='home')||(S.t=='artist'&&t.dataset.t=='artists'))));
 $('#main').innerHTML=S.q?vSearch():({home:vHome,songs:vSongs,artists:vArtists,list:vList,artist:vArtist}[S.t])()}
/* ---------- player ---------- */
const au=new Audio();let Q=[],qi=-1,shuf=0,rep=0,curUrl=null,counted=0;
async function playAt(i){if(i<0||i>=Q.length)return;qi=i;counted=0;const s=songs.get(Q[i]);if(!s)return next();
 const b=await idb('blobs','readonly',st=>st.get(s.id));if(!b)return toast('Audio file missing');
 if(curUrl)URL.revokeObjectURL(curUrl);curUrl=URL.createObjectURL(b.file);au.src=curUrl;au.play().catch(()=>{});paint()}
function startPlay(ids,id,sf){if(!ids.length)return;if(sf!==undefined)shuf=sf;ids=ids.slice();
 if(shuf){const f=id||ids[Math.random()*ids.length|0];Q=[f,...ids.filter(x=>x!=f).sort(()=>Math.random()-.5)];playAt(0)}else{Q=ids;playAt(id?ids.indexOf(id):0)}}
function next(auto){if(!Q.length)return;if(rep==2&&auto)return playAt(qi);let n=qi+1;if(n>=Q.length){if(rep==1||!auto)n=0;else{au.pause();return}}playAt(n)}
function prev(){if(au.currentTime>3)au.currentTime=0;else playAt(Math.max(0,qi-1))}
const toggle=()=>au.paused?au.play():au.pause();
function enq(id,now){if(!Q.length){startPlay([id],id);return}if(now)Q.splice(qi+1,0,id);else Q.push(id);paintQ();toast(now?'Playing next':'Added to queue')}
function paintPlay(){$('#mPlay').textContent=$('#nPlay').textContent=au.paused?'▶':'❚❚'}
function paintQ(){$('#nQ').innerHTML=Q.slice(qi+1,qi+101).map((id,k)=>{const s=songs.get(id);return s?`<div class="song" data-act="jump" data-i="${qi+1+k}"><div class="t"><b>${esc(ttl(s))}</b><small>${esc(s.artist)}</small></div></div>`:''}).join('')||'<p class="mut">Nothing queued.</p>'}
function paint(){const s=songs.get(Q[qi]);if(!s)return;$('#mini').hidden=false;const a=art(cu(s),ttl(s));
 $('#mArt').innerHTML=$('#nArt').innerHTML=a;$('#mT').innerHTML=`<b>${esc(ttl(s))}</b><small>${esc(s.artist||'Unknown artist')}</small>`;
 $('#nT').textContent=ttl(s);$('#nA').textContent=(s.artist||'Unknown artist')+(s.album?' · '+s.album:'');
 $('#nFav').textContent=s.fav?'♥':'♡';$$('#stars span').forEach((x,i)=>x.classList.toggle('on',i<s.rating));
 $('#nShuf').classList.toggle('on',!!shuf);$('#nRep').classList.toggle('on',rep>0);$('#nRep').textContent=rep==2?'⟲1':'⟲';
 paintPlay();paintQ();
 if('mediaSession'in navigator)navigator.mediaSession.metadata=new MediaMetadata({title:ttl(s),artist:s.artist,album:s.album,artwork:s.cover?[{src:cu(s)}]:[]})}
au.onloadedmetadata=()=>{const s=songs.get(Q[qi]);if(s&&!s.dur&&au.src==curUrl&&au.duration>0&&isFinite(au.duration)){s.dur=au.duration;put('songs',s);render()}};
au.onplay=au.onpause=paintPlay;au.onended=()=>next(1);
au.ontimeupdate=()=>{const d=au.duration||0;$('#mBar').style.width=d?au.currentTime/d*100+'%':0;
 if(!$('#np').hidden){$('#nSeek').max=d||1;$('#nSeek').value=au.currentTime;$('#nCur').textContent=fm(au.currentTime);$('#nDur').textContent=fm(d)}
 if(!counted&&d&&au.currentTime>Math.min(30,d/2)){counted=1;const s=songs.get(Q[qi]);if(s){s.plays++;put('songs',s)}}};
if('mediaSession'in navigator){const m=navigator.mediaSession;m.setActionHandler('play',()=>au.play());m.setActionHandler('pause',()=>au.pause());m.setActionHandler('previoustrack',prev);m.setActionHandler('nexttrack',()=>next());m.setActionHandler('seekto',e=>{au.currentTime=e.seekTime})}
$('#mPlay').onclick=e=>{e.stopPropagation();toggle()};$('#nPlay').onclick=toggle;
$('#mPrev').onclick=e=>{e.stopPropagation();prev()};$('#mNext').onclick=e=>{e.stopPropagation();next()};$('#nPrev').onclick=prev;$('#nNext').onclick=()=>next();
$('#mini').onclick=()=>{$('#np').hidden=false;au.ontimeupdate()};$('#nClose').onclick=()=>$('#np').hidden=true;
$('#nSeek').oninput=e=>au.currentTime=+e.target.value;$('#vol').oninput=e=>au.volume=+e.target.value;
$('#nShuf').onclick=()=>{shuf=!shuf?1:0;if(shuf&&qi>=0){const r=Q.splice(qi+1).sort(()=>Math.random()-.5);Q.push(...r)}paint()};
$('#nRep').onclick=()=>{rep=(rep+1)%3;paint()};
$('#nFav').onclick=()=>fav(Q[qi]);
addEventListener('pointerdown',()=>{au.src='data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=';au.play().catch(()=>{})},{once:true});
/* ---------- actions ---------- */
async function fav(id){const s=songs.get(id);s.fav=s.fav?0:1;s.mod=Date.now();await put('songs',s);if(Q[qi]==id)paint();render()}
async function rate(n){const s=songs.get(Q[qi]);if(!s)return;s.rating=s.rating==n?0:n;s.mod=Date.now();await put('songs',s);paint()}
async function addTo(l,ids){const have=new Set(l.songs);let n=0;for(const i of ids)if(!have.has(i)){l.songs.push(i);n++}l.mod=Date.now();await put('lists',l);toast(n?`Added ${n}`:'Already in there');render()}
async function mv(l,id,d){const i=l.songs.indexOf(id),j=i+d;if(j<0||j>=l.songs.length)return;[l.songs[i],l.songs[j]]=[l.songs[j],l.songs[i]];l.mod=Date.now();await put('lists',l);render()}
async function delSong(id){if(!confirm('Delete this song from your library?'))return;songs.delete(id);await del('songs',id);await del('blobs',id);
 for(const l of lists){if(l.songs.includes(id)){l.songs=l.songs.filter(x=>x!=id);l.mod=Date.now();await put('lists',l)}}render()}
const sh=$('#sheet');
function sheet(h){sh.innerHTML=`<div class="bk"></div><div class="pn">${h}</div>`;sh.hidden=false}
const closeSheet=()=>{sh.hidden=true;sh.innerHTML=''};
function menu(title,items){sheet(`<h3>${esc(title)}</h3>`+items.map((it,i)=>`<button class="mi" data-i="${i}">${esc(it[0])}</button>`).join(''));sh._items=items}
sh.onclick=e=>{if(e.target.classList.contains('bk'))return closeSheet();const b=e.target.closest('.mi');if(b){const f=sh._items[b.dataset.i][1];closeSheet();f()}};
function songMenu(id,ctx){const s=songs.get(id),l=lists.find(x=>x.id==ctx);
 const it=[['Play next',()=>enq(id,1)],['Add to queue',()=>enq(id,0)],['Add to playlist or collection…',()=>addMenu(id)],['Edit info'+(needs(s)?' (needs info)':''),()=>editSong(id)],[s.fav?'Remove favourite':'Favourite',()=>fav(id)]];
 if(l)it.push(['Remove from this list',async()=>{l.songs=l.songs.filter(x=>x!=id);l.mod=Date.now();await put('lists',l);render()}],['Move up',()=>mv(l,id,-1)],['Move down',()=>mv(l,id,1)]);
 it.push(['Delete from library',()=>delSong(id)]);menu(ttl(s),it)}
function addMenu(id){menu('Add to…',[...lists.map(l=>[(l.type=='playlist'?'Playlist: ':'Collection: ')+l.name,()=>addTo(l,[id])]),['New playlist with this song',()=>{pending=[id];A.newList()}]])}
let pending=[];
function editSong(id){const s=songs.get(id);sheet(`<h3>Edit info</h3><label>Title</label><input id="eT" value="${esc(s.title)}"><label>Artist</label><input id="eA" value="${esc(s.artist)}"><label>Album (sets its auto collection)</label><input id="eB" value="${esc(s.album)}"><label>Cover art (scaled to fit)</label><div class="sm" id="eP" style="width:90px;height:90px;margin:4px 0 8px">${art(cu(s),ttl(s))}</div><input id="eC" type="file" accept="image/*"><button class="p" data-act="saveInfo" data-id="${id}">Save changes</button>`)}
function listMenu(id){const l=lists.find(x=>x.id==id);if(l)menu(l.name,[['Rename',async()=>{const n=prompt('New name',l.name);if(n&&n.trim()){l.name=n.trim();l.mod=Date.now();await put('lists',l);render()}}],['Delete '+l.type,async()=>{if(!confirm(`Delete "${l.name}"? Songs stay in your library.`))return;lists=lists.filter(x=>x!=l);await del('lists',l.id);A.back();}]])}
let pk={sel:new Set()};
function pickSongs(lid){pk={sel:new Set(),id:lid};const l=lists.find(x=>x.id==lid);
 sheet(`<h3>Add songs to ${esc(l.name)}</h3><label>Pick from</label><select id="pS">${colls().map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('')}${pls().filter(p=>p.id!=lid).map(p=>`<option value="${esc(p.id)}">Playlist: ${esc(p.name)}</option>`).join('')}</select><input id="pQ" type="search" placeholder="Filter"><div id="pL"></div><button class="p" data-act="pkgo" id="pG">Add 0</button>`);pkRender()}
function pkRender(){const l=lists.find(x=>x.id==pk.id),have=new Set(l.songs),src=getList($('#pS').value),q=$('#pQ').value.toLowerCase();
 const ids=src.songs.filter(i=>songs.has(i)&&!have.has(i)&&(ttl(songs.get(i))+' '+songs.get(i).artist).toLowerCase().includes(q)).slice(0,100);pk.shown=ids;
 $('#pL').innerHTML=(ids.length?'<button data-act="pkall">Select shown</button>':'<p class="mut">Nothing to add here.</p>')+ids.map(i=>`<label class="pk"><input type="checkbox" data-pk="${i}" ${pk.sel.has(i)?'checked':''}>${esc(ttl(songs.get(i)))}<small>${esc(songs.get(i).artist)}</small></label>`).join('');$('#pG').textContent='Add '+pk.sel.size}
const setTheme=t=>{document.documentElement.dataset.theme=t;try{localStorage.setItem('th',t)}catch{}};
const curTheme=()=>document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
function exportBackup(){const d={v:1,at:Date.now(),songs:all().map(({cover,...r})=>r),lists};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d)],{type:'application/json'}));a.download='ocarina-of-time-backup.json';a.click()}
async function importBackup(f){try{const d=JSON.parse(await f.text());let n=0;
 for(const r of d.songs||[]){const s=songs.get(r.id);if(s&&(r.mod>s.mod||s.mod==s.added)){Object.assign(s,r,{cover:s.cover||null});await put('songs',s);n++}}
 for(const l of d.lists||[]){const o=lists.find(x=>x.id==l.id);if(!o){lists.push(l);await put('lists',l);n++}else if(l.mod>o.mod){Object.assign(o,l);await put('lists',o);n++}}
 toast(n+' items restored');render()}catch{toast('That file is not an Ocarina of Time backup')}}
const A={
 go:t=>{hist.push(S);S={t:'list',id:t.dataset.id};render();scrollTo(0,0)},
 artist:t=>{hist.push(S);S={t:'artist',id:t.dataset.id};render();scrollTo(0,0)},
 back:()=>{S=hist.pop()||{t:'home'};render()},
 play:t=>startPlay(ctxIds(t.dataset.ctx),t.dataset.id),
 plall:t=>startPlay(ctxIds(t.dataset.id),null,0),
 shuf:t=>startPlay(ctxIds(t.dataset.id),null,1),
 smenu:t=>songMenu(t.dataset.id,t.dataset.ctx),lmenu:t=>listMenu(t.dataset.id),addsongs:t=>pickSongs(t.dataset.id),
 addfiles:()=>$('#file').click(),jump:t=>playAt(+t.dataset.i),rate:t=>rate(+t.dataset.n),
 newList:()=>sheet(`<h3>New</h3><label>Name</label><input id="nN" placeholder="e.g. Road trip"><label>Type</label><select id="nK"><option value="playlist">Playlist</option><option value="collection">Collection (groups playlists)</option></select><button class="p" data-act="mk">Create</button>`),
 mk:async()=>{const name=$('#nN').value.trim();if(!name)return toast('Enter a name');const l={id:'l'+Date.now().toString(36)+rnd(),name,type:$('#nK').value,songs:pending.slice(),mod:Date.now()};pending=[];lists.push(l);await put('lists',l);closeSheet();hist.push(S);S={t:'list',id:l.id};render()},
 saveInfo:async t=>{const s=songs.get(t.dataset.id);s.title=$('#eT').value.trim();s.artist=$('#eA').value.trim();s.album=$('#eB').value.trim();const f=$('#eC').files[0];if(f){s.cover=await fitCover(f);urls.delete(s.id)}s.mod=Date.now();await put('songs',s);closeSheet();if(Q[qi]==s.id)paint();render()},
 pkall:()=>{pk.shown.forEach(i=>pk.sel.add(i));pkRender()},
 pkgo:()=>{const l=lists.find(x=>x.id==pk.id);closeSheet();addTo(l,[...pk.sel])},
 more:()=>menu('Ocarina of Time',[['Switch to '+(curTheme()=='dark'?'light':'dark')+' mode',()=>setTheme(curTheme()=='dark'?'light':'dark')],['Add a whole folder (desktop browsers)',()=>$('#dir').click()],['Export backup',exportBackup],['Import backup',()=>$('#imp').click()],['Storage used',async()=>{const e=await navigator.storage?.estimate?.();toast(e?`${(e.usage/1e9).toFixed(2)} GB used`:'Not available')}]])};
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(t&&A[t.dataset.act])A[t.dataset.act](t)});
$$('.tab').forEach(b=>b.onclick=()=>{S={t:b.dataset.t};hist=[];S.q='';$('#q').value='';S.q='';render()});
$('#file').onchange=e=>{addFiles([...e.target.files]);e.target.value=''};
$('#dir').onchange=e=>{addFiles([...e.target.files]);e.target.value=''};
$('#imp').onchange=e=>{if(e.target.files[0])importBackup(e.target.files[0]);e.target.value=''};
document.addEventListener('input',e=>{if(e.target.id=='pQ')pkRender();else if(e.target.id=='q'){S.q=e.target.value.trim();render()}});
document.addEventListener('change',e=>{const t=e.target;if(t.id=='eC'){const f=t.files[0];if(f)$('#eP').innerHTML=`<img src="${URL.createObjectURL(f)}" alt="">`}else if(t.id=='pS')pkRender();else if(t.dataset.pk){t.checked?pk.sel.add(t.dataset.pk):pk.sel.delete(t.dataset.pk);$('#pG').textContent='Add '+pk.sel.size}});
(async()=>{try{const th=localStorage.getItem('th');if(th)document.documentElement.dataset.theme=th}catch{}
 await open();(await idb('songs','readonly',s=>s.getAll())).forEach(s=>songs.set(s.id,s));lists=await idb('lists','readonly',s=>s.getAll());render();backfill();
 if(navigator.storage?.persist)navigator.storage.persist();
 if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js')})();
</script></body></html>
